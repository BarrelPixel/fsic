name: Publish Scheduled Blog Posts

on:
  # Run daily at 9 AM EST (2 PM UTC)
  schedule:
    - cron: '0 14 * * *'
  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for scheduled posts
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Today is $TODAY"
          
          # Find posts with status: review and publishDate <= today
          POSTS_TO_PUBLISH=$(node -e "
            const fs = require('fs');
            const path = require('path');
            const blogDir = './src/content/blog';
            const today = new Date('$TODAY');
            today.setHours(0, 0, 0, 0);
            
            const files = fs.readdirSync(blogDir).filter(f => f.endsWith('.md'));
            const toPublish = [];
            
            for (const file of files) {
              const content = fs.readFileSync(path.join(blogDir, file), 'utf-8');
              const lines = content.split('\\n');
              
              let inFrontmatter = false;
              let status = null;
              let publishDate = null;
              
              for (const line of lines) {
                if (line === '---') {
                  if (!inFrontmatter) {
                    inFrontmatter = true;
                  } else {
                    break;
                  }
                  continue;
                }
                
                if (inFrontmatter) {
                  const statusMatch = line.match(/^status:\\s*['\"]?([a-z]+)['\"]?/);
                  if (statusMatch) status = statusMatch[1];
                  
                  const dateMatch = line.match(/^publishDate:\\s*['\"]?([0-9-]+)['\"]?/);
                  if (dateMatch) publishDate = dateMatch[1];
                }
              }
              
              if (status === 'review' && publishDate) {
                const postDate = new Date(publishDate);
                postDate.setHours(0, 0, 0, 0);
                if (postDate <= today) {
                  toPublish.push(file);
                }
              }
            }
            
            console.log(JSON.stringify(toPublish));
          ")
          
          echo "posts=$POSTS_TO_PUBLISH" >> $GITHUB_OUTPUT
          
          if [ "$POSTS_TO_PUBLISH" != "[]" ]; then
            echo "has_posts=true" >> $GITHUB_OUTPUT
            echo "Found posts to publish: $POSTS_TO_PUBLISH"
          else
            echo "has_posts=false" >> $GITHUB_OUTPUT
            echo "No posts scheduled for publication today"
          fi

      - name: Publish scheduled posts
        if: steps.check.outputs.has_posts == 'true'
        run: |
          POSTS='${{ steps.check.outputs.posts }}'
          
          node -e "
            const fs = require('fs');
            const path = require('path');
            const posts = JSON.parse('$POSTS');
            const blogDir = './src/content/blog';
            
            for (const file of posts) {
              const filePath = path.join(blogDir, file);
              let content = fs.readFileSync(filePath, 'utf-8');
              
              // Replace status: review with status: published
              content = content.replace(/^status:\s*['\"]?review['\"]?$/m, 'status: published');
              
              fs.writeFileSync(filePath, content, 'utf-8');
              console.log('Published: ' + file);
            }
          "

      - name: Update blog plan
        if: steps.check.outputs.has_posts == 'true'
        run: npm run blog-plan

      - name: Run checks
        if: steps.check.outputs.has_posts == 'true'
        run: |
          npm run check
          npm run check-links

      - name: Commit and push
        if: steps.check.outputs.has_posts == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish scheduled blog posts"
          git push
