name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every morning so blog posts scheduled by FSIC (status: scheduled, publishDate reached) go live on
  # their day without a commit (src/lib/blog-status.ts). 9:00 AM Eastern standard time.
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # Builds the site, then fails the deploy on a broken internal link or anchor.
      - name: Build and check links
        run: npm run check-links

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
